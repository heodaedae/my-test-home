
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPORTS PICKS</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #f1f4fa;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 42px 24px;
      background: #192235;
      border: 1px solid #293750;
      border-radius: 16px;
    }

    .brand {
      color: #75a7ff;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      margin: 20px 0 12px;
    }

    p {
      color: #aab5c8;
      font-size: 14px;
      line-height: 1.8;
    }

    .notice {
      margin-top: 30px;
      padding: 16px;
      background: #111a2a;
      border-radius: 10px;
      color: #c4cede;
      font-size: 13px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 28px;
      color: #77849a;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">SPORTS PICKS</div>
    <h1>SPORTS INFORMATION</h1>
    <p>스포츠 분석 정보 및 픽 공유 페이지</p>

    <div class="notice">
      원활한 이용을 위해<br>
      텔레그램 오른쪽 위 ⋮ 메뉴에서<br>
      <strong>브라우저에서 열기</strong>를 선택해 주세요.
    </div>

    <div class="footer">SPORTS PICKS</div>
  </main>

  <script>
    const partnerUrl =
      "https://link.coupang.com/a/hltOLhmsKq";

    const intentUrl =
      "intent://link.coupang.com/a/hltOLhmsKq#Intent;" +
      "scheme=https;" +
      "package=com.coupang.mobile;" +
      "S.browser_fallback_url=" +
      encodeURIComponent(partnerUrl) +
      ";end";

    // 기존 테스트에서 성공했던 브라우저 기록 방식
    history.pushState(
      { returnToPage: true },
      "",
      location.pathname + "?returnPage=1"
    );

    // 페이지가 열린 뒤 쿠팡 앱 실행 시도
    window.location.href = intentUrl;
  </script>
</body>
</html>
