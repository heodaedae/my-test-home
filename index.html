
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쿠팡 상품 연결</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    a {
      display: inline-block;
      padding: 15px 25px;
      background: #346aff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>쿠팡 상품으로 이동합니다</h2>
  <p id="status">잠시 후 쿠팡 앱 실행을 시도합니다.</p>

  <a id="coupang"
     href="https://link.coupang.com/a/hltOLhmsKq">
    쿠팡 상품 보기
  </a>

  <script>
    const coupangUrl =
      "https://link.coupang.com/a/hltOLhmsKq";

    // 원래 페이지를 브라우저 기록에 남기기 위한 처리
    if (!history.state || !history.state.coupangPage) {
      history.replaceState(
        { coupangPage: true },
        "",
        location.href
      );
    }

    // 사용자가 페이지에 진입한 뒤 앱 실행 시도
    setTimeout(function () {
      document.getElementById("status").textContent =
        "쿠팡 상품 페이지를 여는 중입니다.";

      window.location.href = coupangUrl;
    }, 1000);

    // 자동 실행이 안 될 때 사용할 버튼
    document.getElementById("coupang").addEventListener(
      "click",
      function () {
        window.location.href = coupangUrl;
      }
    );
  </script>
</body>
</html>
