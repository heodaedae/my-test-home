
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPORTS PICKS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 38px 24px;
      text-align: center;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
    }
    .brand {
      color: #60a5fa;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    h1 { font-size: 25px; margin: 22px 0 10px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.7; }
    .button {
      display: block;
      margin-top: 28px;
      padding: 16px;
      border-radius: 8px;
      background: #3979ed;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .footer {
      margin-top: 25px;
      color: #6b7280;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">SPORTS PICKS</div>
    <h1>오늘의 픽 확인</h1>
    <p>Today's Sports Information</p>

    <a class="button" href="pick.html">PICK 확인하기</a>

    <div class="footer">DAILY SPORTS INFORMATION</div>
  </main>
</body>
</html>
