
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 추천 픽</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 24px 16px;
      color: #222;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 6px;
    }

    .date {
      color: #777;
      margin-bottom: 24px;
    }

    .pick {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #eee;
    }

    .number {
      color: #346aff;
      font-weight: bold;
      margin-right: 8px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: #346aff;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>오늘의 추천 픽</h2>
    <div class="date" id="today"></div>

    <div class="pick"><span class="number">01</span> 경기 정보 입력</div>
    <div class="pick"><span class="number">02</span> 경기 정보 입력</div>
    <div class="pick"><span class="number">03</span> 경기 정보 입력</div>
    <div class="pick"><span class="number">04</span> 경기 정보 입력</div>
    <div class="pick"><span class="number">05</span> 경기 정보 입력</div>
    <div class="pick"><span class="number">06</span> 경기 정보 입력</div>
    <div class="pick"><span class="number">07</span> 경기 정보 입력</div>
    <div class="pick"><span class="number">08</span> 경기 정보 입력</div>

    <button id="openCoupang">쿠팡 앱 실행</button>
    <div id="status">오늘의 픽을 확인하세요.</div>
  </div>

  <script>
    const now = new Date();

    document.getElementById("today").textContent =
      now.getFullYear() + "." +
      String(now.getMonth() + 1).padStart(2, "0") + "." +
      String(now.getDate()).padStart(2, "0");

    const partnerUrl =
      "https://link.coupang.com/a/ioZXNblZgO";

    document.getElementById("openCoupang").addEventListener(
      "click",
      function () {
        history.pushState(
          { step: "before-coupang" },
          "",
          location.href
        );

        document.getElementById("status").textContent =
          "쿠팡 앱으로 이동합니다.";

        window.location.href = partnerUrl;
      }
    );

    window.addEventListener("popstate", function () {
      document.getElementById("status").textContent =
        "픽 페이지로 돌아왔습니다.";
    });
  </script>
</body>
</html>
