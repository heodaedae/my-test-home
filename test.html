
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쿠팡 앱 복귀 테스트</title>
</head>
<body>
  <h2>쿠팡 앱 복귀 테스트</h2>
  <p>아래 버튼을 눌러 쿠팡 앱을 실행하세요.</p>
  <p>뒤로 가기 동작을 확인하는 테스트 페이지입니다.</p>

  <button id="openCoupang">쿠팡 앱 실행 테스트</button>

  <script>
    const partnerUrl = "https://link.coupang.com/a/hltOLhmsKq";

    document.getElementById("openCoupang").addEventListener("click", function () {
      // 현재 페이지의 방문 기록에 테스트용 단계를 추가
      history.pushState(
        { step: "before-coupang" },
        "",
        location.href
      );

      // 기존 파트너스 링크를 통해 쿠팡 앱 실행
      window.location.href = partnerUrl;
    });

    window.addEventListener("popstate", function () {
      document.title = "쿠팡 복귀 테스트";
      document.body.insertAdjacentHTML(
        "beforeend",
        "<p>웹페이지로 돌아왔습니다.</p>"
      );
    });
  </script>
</body>
</html>
